<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大雜燴轉盤 ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* 🌟 背景遮罩調亮：大幅降低黑罩濃度，讓 bg.jpg 更清晰 */
      background: linear-gradient(rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.3)), 
                  url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
      overflow-x: hidden;
    }

    /* 🔊 音樂控制按鈕 */
    .audio-control {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      z-index: 100;
    }

    /* 頂部標題 */
    .header-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(56, 189, 248, 0.8);
      letter-spacing: 0.15em;
      font-weight: 900;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      letter-spacing: 0.1em;
      margin-top: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* 🎰 水墨金屬拉霸視窗 */
    .slot-machine-container {
      width: 100%;
      max-width: 480px;
      height: 380px;
      background: rgba(15, 23, 42, 0.75);
      border: 3px solid #38bdf8;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(6px);
    }

    .slot-screen {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      object-fit: contain;
    }

    /* ⚡ 轉動時的高速文字顯示區 */
    #slot-text-spin {
      font-size: 2rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.9), 0 0 25px rgba(255, 255, 255, 0.8);
      letter-spacing: 0.1em;
      text-align: center;
      animation: pulse 0.1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* 📜 下方無厘頭文字顯示區 */
    .status-container {
      width: 100%;
      max-width: 480px;
      height: 50px;
      margin-top: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #status-text {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      color: #7dd3fc;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      text-align: center;
      transition: all 0.3s ease;
    }

    /* 🎮 控制按鈕與把手 */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .spin-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #38bdf8;
      border: 2px solid #38bdf8;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
      letter-spacing: 0.1em;
    }

    .spin-btn.active-stop {
      background: linear-gradient(135deg, #991b1b 0%, #450a0a 100%);
      color: #fca5a5;
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
    }

    .spin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
    }

    .spin-btn:active {
      transform: translateY(1px);
    }

    /* 🕹️ 仙俠把手 */
    .lever-container {
      width: 18px;
      height: 75px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .lever-stick {
      width: 6px;
      height: 55px;
      background: linear-gradient(to right, #64748b, #94a3b8, #475569);
      position: absolute;
      top: 10px;
      transform-origin: bottom center;
      transition: transform 0.3s ease;
    }

    .lever-ball {
      width: 22px;
      height: 22px;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #0369a1);
      border-radius: 50%;
      position: absolute;
      top: -10px;
      left: -8px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .lever-pull .lever-stick {
      transform: rotateX(60deg) scaleY(0.5);
    }
  </style>
</head>
<body>

  <!-- 🎵 音訊元素 (背景音樂 + 效果音) -->
  <button id="bgm-btn" class="audio-control" onclick="toggleBGM()">🎵 </button>
  <audio id="bgm" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=chinamusic-113579.mp3"></audio>
  <audio id="sfx-spin" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3"></audio>
  <audio id="sfx-stop" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

  <div class="header-banner">
    <h1>六人成虎 ‧ 渡劫法陣 ⚡</h1>
    <div class="subtitle">— 職場萬劫不復，唯有抽籤渡化 —</div>
  </div>

  <!-- 🎰 拉霸視窗 -->
  <div class="slot-machine-container">
    <div class="slot-screen">
      <!-- 轉動時顯示高速切換文字 -->
      <div id="slot-text-spin" style="display: none;">☯️ 陣法啟動 ☯️</div>
      <!-- 停止時顯示開牌圖片 -->
      <img id="meme" src="" alt="仙俠籤圖" style="display: none;">
    </div>
  </div>

  <!-- 📜 文字顯示區 -->
  <div class="status-container">
    <div id="status-text">請拉動把手，啟動渡劫法陣 ☯️</div>
  </div>

  <!-- 🎮 控制區 -->
  <div class="controls">
    <button id="draw-btn" class="spin-btn" onclick="toggleSlot()">啟動法陣 ⚡</button>
    <div id="lever" class="lever-container">
      <div class="lever-stick">
        <div class="lever-ball"></div>
      </div>
    </div>
  </div>

  <script>
    const username = "lair06";
    const repo = "meme-site";
    const folderPath = "meme picture";

    let memesList = [];
    let lastIndex = -1;
    let isSpinning = false;
    let textInterval = null;
    let slotTextInterval = null;

    // ⚡ 轉盤中央高速滾動的仙俠招式/詞彙
    const spinFastTexts = [
      "⚡ 萬劍歸宗 ⚡",
      "🔥 渡劫天火 🔥",
      "🌀 太極八卦 🌀",
      "💥 乾坤一擲 💥",
      "✨ 靈石飛昇 ✨",
      "🗡️ 蜀山劍意 🗡️",
      "🐉 九龍吐珠 🐉",
      "🔮 天道輪迴 🔮",
      "📜 離職心法 📜",
      "☠️ 加班天劫 ☠️"
    ];

    // 🤪 下方無厘頭文字庫
    const xianxiaTexts = [
      "【正在偷翻掌門人的內褲...】",
      "【深入6F洗手間渡劫中...】",
      "【偷看長老皮夾裡的靈石數量...】",
      "【強行吸收隔壁師兄的加班廢氣...】",
      "【正在審查同門師弟的離職心法...】",
      "【茶水間偷聽仙界密辛中...】",
      "【潛入老祖夢境索取特休假...】",
      "【計算今日偷懶獲得的修為...】",
      "【正在幫掌門的靈丹偷加廢料...】",
      "【正在修改天劫考勤系統...】",
      "【召喚「不想上工」之太古魔尊...】"
    ];

    // 🎵 BGM 控制
    let isPlayingBGM = false;
    function toggleBGM() {
      const bgm = document.getElementById("bgm");
      const btn = document.getElementById("bgm-btn");
      if (!isPlayingBGM) {
        bgm.play();
        btn.innerText = "🔊 靜音 BGM";
        isPlayingBGM = true;
      } else {
        bgm.pause();
        btn.innerText = "🎵 播放仙俠BGM";
        isPlayingBGM = false;
      }
    }

    async function fetchMemeList() {
      const statusText = document.getElementById("status-text");
      try {
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${encodeURIComponent(folderPath)}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("無法讀取 GitHub 資料夾");

        const data = await response.json();
        memesList = data
          .filter(file => file.type === "file" && /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name))
          .map(file => file.path);

        if (memesList.length > 0) {
          statusText.innerText = "法陣已就緒，請啟動！ ☯️";
        } else {
          statusText.innerText = "資料夾內尚未放置靈圖！";
        }
      } catch (error) {
        console.error(error);
        statusText.innerText = "法陣連線失敗，請檢查設定！";
      }
    }

    function toggleSlot() {
      if (memesList.length === 0) return;

      if (!isSpinning) {
        startSpinning();
      } else {
        stopSpinning();
      }
    }

    // 啟動滾動
    function startSpinning() {
      isSpinning = true;
      const drawBtn = document.getElementById("draw-btn");
      const lever = document.getElementById("lever");
      const imgElement = document.getElementById("meme");
      const slotTextSpin = document.getElementById("slot-text-spin");

      // 播放音效
      document.getElementById("sfx-spin").play();

      // 把手動畫
      lever.classList.add("lever-pull");
      setTimeout(() => lever.classList.remove("lever-pull"), 400);

      // 隱藏圖片，顯示中央高速轉動文字
      imgElement.style.display = "none";
      slotTextSpin.style.display = "block";

      // 1. 中央文字超高速閃爍切換 (80ms)
      slotTextInterval = setInterval(() => {
        const randomSpinText = spinFastTexts[Math.floor(Math.random() * spinFastTexts.length)];
        slotTextSpin.innerText = randomSpinText;
      }, 80);

      // 切換按鈕狀態
      drawBtn.innerText = "🛑 煞車！開箱結緣";
      drawBtn.classList.add("active-stop");

      // 2. 下方無厘頭文字：每 3 秒換一句
      const randomText = xianxiaTexts[Math.floor(Math.random() * xianxiaTexts.length)];
      document.getElementById("status-text").innerText = randomText;

      textInterval = setInterval(() => {
        const randomText = xianxiaTexts[Math.floor(Math.random() * xianxiaTexts.length)];
        document.getElementById("status-text").innerText = randomText;
      }, 3000);
    }

    // 停止滾動並開牌
    function stopSpinning() {
      const drawBtn = document.getElementById("draw-btn");
      const imgElement = document.getElementById("meme");
      const slotTextSpin = document.getElementById("slot-text-spin");
      const statusText = document.getElementById("status-text");

      // 播放停止音效
      document.getElementById("sfx-stop").play();

      clearInterval(textInterval);
      clearInterval(slotTextInterval);

      // 隱藏轉動文字，顯示定格圖片
      slotTextSpin.style.display = "none";

      // 隨機選圖
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * memesList.length);
      } while (randomIndex === lastIndex && memesList.length > 1);
      lastIndex = randomIndex;

      const selectedImgSrc = memesList[randomIndex];
      imgElement.src = selectedImgSrc;
      imgElement.style.display = "block";

      // 結緣文字停留展示 3 秒
      const finalRandomText = xianxiaTexts[Math.floor(Math.random() * xianxiaTexts.length)];
      statusText.innerText = `✨ 結緣成功：${finalRandomText}`;

      // 重置按鈕
      drawBtn.innerText = "啟動法陣 ⚡";
      drawBtn.classList.remove("active-stop");
      isSpinning = false;

      // 3 秒後恢復預設提示
      setTimeout(() => {
        if (!isSpinning) {
          statusText.innerText = "法陣已就緒，請再次啟動！ ☯️";
        }
      }, 3000);
    }

    window.onload = fetchMemeList;
  </script>
</body>
</html>
