<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上班很難 笑個好嗎 ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* 🌟 背景遮罩保持清晰 */
      background: linear-gradient(rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.3)), 
                  url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* 🌧️ 雷雨 Canvas 背景畫布 */
    #weather-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* ⚡ 閃電全螢幕白光特效 */
    .lightning-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.25);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.05s ease-out;
    }

    /* ↗️ 右上角工具列容器 */
    .top-toolbar {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    /* 🔊 & 👁️ 通用頂部按鈕樣式 */
    .audio-control, .toggle-ui-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .audio-control:hover, .toggle-ui-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    /* 🎵 音樂下拉選單容器 */
    .bgm-dropdown-container {
      position: relative;
    }

    .bgm-menu {
      display: none;
      position: absolute;
      top: 42px;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 10px;
      width: 175px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
      flex-direction: column;
      gap: 6px;
      z-index: 110;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bgm-menu.show {
      display: flex;
    }

    .bgm-menu-item, .bgm-track-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: left;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .bgm-menu-item:hover, .bgm-track-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    .bgm-track-btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
    }

    .menu-divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 2px 0;
    }

    .menu-label {
      font-size: 0.72rem;
      color: #94a3b8;
      padding: 2px 4px;
    }

    /* 📦 主要介面區塊 */
    .ui-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 10;
    }

    /* 隱藏狀態 */
    .ui-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    /* 頂部標題 */
    .header-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(56, 189, 248, 0.8);
      letter-spacing: 0.15em;
      font-weight: 900;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      letter-spacing: 0.1em;
      margin-top: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* 🎰 水墨金屬拉霸視窗 */
    .slot-machine-container {
      width: 100%;
      max-width: 480px;
      height: 380px;
      background: rgba(15, 23, 42, 0.75);
      border: 3px solid #38bdf8;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(6px);
    }

    .slot-screen {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      object-fit: contain;
    }

    /* ⚡ 轉動時的高速文字顯示區 */
    #slot-text-spin {
      font-size: 2rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.9), 0 0 25px rgba(255, 255, 255, 0.8);
      letter-spacing: 0.1em;
      text-align: center;
      animation: pulse 0.1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* 📜 下方無厘頭文字顯示區 */
    .status-container {
      width: 100%;
      max-width: 480px;
      height: 50px;
      margin-top: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #status-text {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      color: #7dd3fc;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      text-align: center;
      transition: all 0.3s ease;
    }

    /* 🎮 控制按鈕與把手 */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .spin-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #38bdf8;
      border: 2px solid #38bdf8;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
      letter-spacing: 0.1em;
    }

    .spin-btn.active-stop {
      background: linear-gradient(135deg, #991b1b 0%, #450a0a 100%);
      color: #fca5a5;
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
    }

    .spin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
    }

    .spin-btn:active {
      transform: translateY(1px);
    }

    /* 🕹️ 仙俠把手 */
    .lever-container {
      width: 18px;
      height: 75px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .lever-stick {
      width: 6px;
      height: 55px;
      background: linear-gradient(to right, #64748b, #94a3b8, #475569);
      position: absolute;
      top: 10px;
      transform-origin: bottom center;
      transition: transform 0.3s ease;
    }

    .lever-ball {
      width: 22px;
      height: 22px;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #0369a1);
      border-radius: 50%;
      position: absolute;
      top: -10px;
      left: -8px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .lever-pull .lever-stick {
      transform: rotateX(60deg) scaleY(0.5);
    }
  </style>
</head>
<body>

  <!-- 🌧️ 雨滴 Canvas 與 ⚡ 閃電遮罩 -->
  <canvas id="weather-canvas"></canvas>
  <div id="lightning" class="lightning-flash"></div>

  <!-- ↗️ 右上角功能按鈕列 -->
  <div class="top-toolbar">
    <button id="ui-btn" class="toggle-ui-btn" onclick="toggleUI()">👁️ </button>
    
    <!-- 🎵 音樂下拉選單 -->
    <div class="bgm-dropdown-container">
      <button id="bgm-btn" class="audio-control" onclick="toggleBgmMenu()">🎵 </button>
      <div id="bgm-menu" class="bgm-menu">
        <button id="bgm-toggle-btn" class="bgm-menu-item" onclick="toggleBGM()">▶️ 播放音樂</button>
        <hr class="menu-divider">
        <div class="menu-label">切換仙俠曲目：</div>
        <button class="bgm-track-btn active" onclick="selectTrack(0, this)">🎼 仙俠悠揚</button>
        <button class="bgm-track-btn" onclick="selectTrack(1, this)">⚔️ 靈山渡劫</button>
        <button class="bgm-track-btn" onclick="selectTrack(2, this)">🍃 幽谷竹笛</button>
        <button class="bgm-track-btn" onclick="selectTrack(3, this)">🪕 蜀山古箏</button>
      </div>
    </div>
  </div>

  <!-- 🎵 音訊效果 -->
  <audio id="bgm" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=chinamusic-113579.mp3"></audio>
  <audio id="sfx-spin" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3"></audio>
  <audio id="sfx-stop" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

  <!-- 📦 主要介面區塊 -->
  <div id="main-ui" class="ui-wrapper">
    <div class="header-banner">
      <h1>六人成虎 ‧ 渡劫法陣 ⚡</h1>
      <div class="subtitle">— 職場萬劫不復，唯有抽籤渡化 —</div>
    </div>

    <!-- 🎰 拉霸視窗 -->
    <div class="slot-machine-container">
      <div class="slot-screen">
        <div id="slot-text-spin" style="display: none;">☯️ 陣法啟動 ☯️</div>
        <img id="meme" src="" alt="仙俠籤圖" style="display: none;">
      </div>
    </div>

    <!-- 📜 文字顯示區 -->
    <div class="status-container">
      <div id="status-text">請拉動把手，啟動渡劫法陣 ☯️</div>
    </div>

    <!-- 🎮 控制區 -->
    <div class="controls">
      <button id="draw-btn" class="spin-btn" onclick="toggleSlot()">啟動法陣 ⚡</button>
      <div id="lever" class="lever-container">
        <div class="lever-stick">
          <div class="lever-ball"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const username = "lair06";
    const repo = "meme-site";
    const folderPath = "meme picture";

    let memesList = [];
    let lastIndex = -1;
    let isSpinning = false;
    let textInterval = null;
    let slotTextInterval = null;
    let isUiHidden = false;

    // ⚡ 轉盤中央高速滾動招式
    const spinFastTexts = [
      "⚡ 萬劍歸宗 ⚡",
      "🔥 渡劫天火 🔥",
      "🌀 太極八卦 🌀",
      "💥 乾坤一擲 💥",
      "✨ 靈石飛昇 ✨",
      "🗡️ 蜀山劍意 🗡️",
      "🐉 九龍吐珠 🐉",
      "🔮 天道輪迴 🔮",
      "📜 離職心法 📜",
      "☠️ 加班天劫 ☠️"
    ];

    // 🤪 下方無厘頭文字庫
    const xianxiaTexts = [
      "【正在偷翻???的內褲...】",
      "【深入6F洗手間渡劫中...】",
      "【偷看龜董皮夾裡的靈石數量...】",
      "【強行吸收隔壁同仁的加班廢氣...】",
      "【正在審查同門丞董的離職心法...】",
      "【茶水間偷聽仙界密辛中...】",
      "【潛入主管夢境索取特休假...】",
      "【計算今日偷懶獲得的修為...】",
      "【正在幫長官的靈丹偷加廢料...】",
      "【正在修改天劫考勤系統...】",
      "【召喚「不想上工」之捲爺魔尊...】"
    ];

    // 🎶 多首仙俠 BGM 曲目資料庫
    const bgmTracks = [
      "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=chinamusic-113579.mp3",
      "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a706be.mp3?filename=traditional-chinese-music-10271.mp3",
      "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=chinese-bamboo-flute-14022.mp3",
      "https://cdn.pixabay.com/download/audio/2022/10/14/audio_993f309a4b.mp3?filename=chinese-guzheng-12345.mp3"
    ];

    let currentTrackIndex = 0;
    let isPlayingBGM = false;

    // 展開 / 收起音樂選單
    function toggleBgmMenu() {
      const menu = document.getElementById("bgm-menu");
      menu.classList.toggle("show");
    }

    // 點擊選單外部自動關閉下拉選單
    window.addEventListener('click', (e) => {
      const container = document.querySelector('.bgm-dropdown-container');
      if (container && !container.contains(e.target)) {
        document.getElementById("bgm-menu")?.classList.remove("show");
      }
    });

    // 開關播放控制
    function toggleBGM() {
      const bgm = document.getElementById("bgm");
      const toggleBtn = document.getElementById("bgm-toggle-btn");
      const bgmMainBtn = document.getElementById("bgm-btn");

      if (!isPlayingBGM) {
        bgm.play().catch(e => console.log("BGM Play prevented:", e));
        toggleBtn.innerText = "⏸️ 關閉音樂";
        bgmMainBtn.innerText = "🔊 ";
        isPlayingBGM = true;
      } else {
        bgm.pause();
        toggleBtn.innerText = "▶️ 播放音樂";
        bgmMainBtn.innerText = "🎵 ";
        isPlayingBGM = false;
      }
    }

    // 切換曲目
    function selectTrack(index, btnElement) {
      currentTrackIndex = index;
      const bgm = document.getElementById("bgm");
      bgm.src = bgmTracks[index];

      // 更新選單按鈕高亮樣式
      document.querySelectorAll('.bgm-track-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      // 若原先正在播放，更換後繼續播放；若靜音則自動開始播放
      if (isPlayingBGM) {
        bgm.play();
      } else {
        toggleBGM();
      }
    }

    // 🌧️⚡ 下雨 + 閃電動畫引擎
    function initWeatherEffect() {
      const canvas = document.getElementById('weather-canvas');
      const ctx = canvas.getContext('2d');
      const lightning = document.getElementById('lightning');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const rainDrops = [];
      for (let i = 0; i < 150; i++) {
        rainDrops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 20 + 10,
          speed: Math.random() * 10 + 15,
          opacity: Math.random() * 0.4 + 0.2
        });
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1;

        rainDrops.forEach(drop => {
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - 2, drop.y + drop.length);
          ctx.stroke();

          drop.y += drop.speed;
          drop.x -= 1;

          if (drop.y > height) {
            drop.y = -drop.length;
            drop.x = Math.random() * width;
          }
        });

        if (Math.random() < 0.015) {
          lightning.style.opacity = '1';
          setTimeout(() => { lightning.style.opacity = '0'; }, 60);
          setTimeout(() => { 
            if (Math.random() < 0.5) {
              lightning.style.opacity = '0.8';
              setTimeout(() => { lightning.style.opacity = '0'; }, 40);
            }
          }, 100);
        }

        requestAnimationFrame(render);
      }

      render();
    }

    // 👁️ 隱藏 / 顯示 UI 邏輯
    function toggleUI() {
      const mainUi = document.getElementById("main-ui");
      const uiBtn = document.getElementById("ui-btn");

      if (!isUiHidden) {
        mainUi.classList.add("ui-hidden");
        uiBtn.innerText = "👁️ ";
        isUiHidden = true;
      } else {
        mainUi.classList.remove("ui-hidden");
        uiBtn.innerText = "👁️ ";
        isUiHidden = false;
      }
    }

    async function fetchMemeList() {
      const statusText = document.getElementById("status-text");
      try {
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${encodeURIComponent(folderPath)}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("無法讀取 GitHub 資料夾");

        const data = await response.json();
        memesList = data
          .filter(file => file.type === "file" && /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name))
          .map(file => file.path);

        if (memesList.length > 0) {
          statusText.innerText = "法陣已就緒，請啟動！ ☯️";
        } else {
          statusText.innerText = "資料夾內尚未放置靈圖！";
        }
      } catch (error) {
        console.error(error);
        statusText.innerText = "法陣連線失敗，請檢查設定！";
      }
    }

    function toggleSlot() {
      if (memesList.length === 0) return;

      if (!isSpinning) {
        startSpinning();
      } else {
        stopSpinning();
      }
    }

    function startSpinning() {
      isSpinning = true;
      const drawBtn = document.getElementById("draw-btn");
      const lever = document.getElementById("lever");
      const imgElement = document.getElementById("meme");
      const slotTextSpin = document.getElementById("slot-text-spin");

      document.getElementById("sfx-spin").play();

      lever.classList.add("lever-pull");
      setTimeout(() => lever.classList.remove("lever-pull"), 400);

      imgElement.style.display = "none";
      slotTextSpin.style.display = "block";

      slotTextInterval = setInterval(() => {
        const randomSpinText = spinFastTexts[Math.floor(Math.random() * spinFastTexts.length)];
        slotTextSpin.innerText = randomSpinText;
      }, 80);

      drawBtn.innerText = "🛑 吸收天地靈氣!強行突破!";
      drawBtn.classList.add("active-stop");

      const randomText = xianxiaTexts[Math.floor(Math.random() * xianxiaTexts.length)];
      document.getElementById("status-text").innerText = randomText;

      textInterval = setInterval(() => {
        const randomText = xianxiaTexts[Math.floor(Math.random() * xianxiaTexts.length)];
        document.getElementById("status-text").innerText = randomText;
      }, 3000);
    }

    function stopSpinning() {
      const drawBtn = document.getElementById("draw-btn");
      const imgElement = document.getElementById("meme");
      const slotTextSpin = document.getElementById("slot-text-spin");
      const statusText = document.getElementById("status-text");

      document.getElementById("sfx-stop").play();

      clearInterval(textInterval);
      clearInterval(slotTextInterval);

      slotTextSpin.style.display = "none";

      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * memesList.length);
      } while (randomIndex === lastIndex && memesList.length > 1);
      lastIndex = randomIndex;

      const selectedImgSrc = memesList[randomIndex];
      imgElement.src = selectedImgSrc;
      imgElement.style.display = "block";

      const finalRandomText = xianxiaTexts[Math.floor(Math.random() * xianxiaTexts.length)];
      statusText.innerText = `✨ 渡劫成功：${finalRandomText}`;

      drawBtn.innerText = "啟動法陣 ⚡";
      drawBtn.classList.remove("active-stop");
      isSpinning = false;

      setTimeout(() => {
        if (!isSpinning) {
          statusText.innerText = "法陣已就緒，請再次啟動！ ☯️";
        }
      }, 3000);
    }

    window.onload = () => {
      fetchMemeList();
      initWeatherEffect();
    };
  </script>
</body>
</html>
