<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上班厭世梗圖抽取器 💼</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1d;
      color: #eeeeee;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #a2a2a2;
      font-weight: normal;
    }
    .meme-container {
      max-width: 95%;
      max-height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      min-height: 250px;
    }
    img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      object-fit: contain;
    }
    button {
      background-color: #4e542e;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #616939;
    }
    button:active {
      transform: scale(0.95);
    }
    #loading {
      font-size: 1rem;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>💼 今天又是不想上班的一天...</h1>

  <div class="meme-container">
    <div id="loading">抽取厭世能量中... 🎲</div>
    <img id="meme" src="" alt="上班厭世梗圖" style="display: none;">
  </div>

  <button onclick="getRandomMeme()">再抽一張厭世圖 😮‍💨</button>

  <script>
    // 預先準備上百張熱門梗图的自動加載機制
    // 這裡使用自動抓取公開梗圖庫 API
    async function getRandomMeme() {
      const imgElement = document.getElementById("meme");
      const loadingElement = document.getElementById("loading");

      loadingElement.style.display = "block";
      imgElement.style.display = "none";

      try {
        // 從梗圖資料庫隨機獲取圖片 (支援海量圖庫)
        const timestamp = new Date().getTime();
        // 隨機從 API 抓取熱門梗圖
        const response = await fetch(`https://meme-api.com/gimme/workmemes/${timestamp}`);
        
        if (!response.ok) {
          // 備用方案：若特定板塊失敗，抓取全網隨機熱門梗圖
          const fallbackResponse = await fetch(`https://meme-api.com/gimme`);
          const fallbackData = await fallbackResponse.json();
          imgElement.src = fallbackData.url;
        } else {
          const data = await response.json();
          imgElement.src = data.url;
        }

        imgElement.onload = () => {
          loadingElement.style.display = "none";
          imgElement.style.display = "block";
        };
      } catch (error) {
        // 若 API 完全斷開，備用本機/常見梗圖庫
        imgElement.src = "https://picsum.photos/id/1025/600/600";
        loadingElement.style.display = "none";
        imgElement.style.display = "block";
      }
    }

    // 第一次進頁面自動隨機顯示
    window.onload = getRandomMeme;
  </script>
</body>
</html>
