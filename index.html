<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上班厭世梗圖抽取器 💼</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1d;
      color: #eeeeee;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #a2a2a2;
      font-weight: normal;
    }
    .meme-container {
      width: 100%;
      max-width: 500px;
      height: 60vh;
      max-height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      position: relative;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      object-fit: contain;
    }
    button {
      background-color: #4e542e;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #616939;
    }
    button:active {
      transform: scale(0.95);
    }
    #loading {
      font-size: 1rem;
      color: #888;
      position: absolute;
    }
  </style>
</head>
<body>

  <h1>💼 今天又是不想上班的一天...</h1>

  <div class="meme-container">
    <div id="loading">載入圖片庫中... 🎲</div>
    <img id="meme" src="" alt="上班厭世梗圖" style="display: none;">
  </div>

  <button onclick="getRandomMeme()">再抽一張厭世圖 😮‍💨</button>

  <script>
    // GitHub API 相關設定
    const username = "lair06";
    const repo = "meme-site";
    const folderPath = "meme picture";

    let memesList = [];
    let lastIndex = -1;

    // 頁面載入時，自動向 GitHub 抓取資料夾內的圖片檔名清單
    async function fetchMemeList() {
      const loadingElement = document.getElementById("loading");
      try {
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${encodeURIComponent(folderPath)}`;
        const response = await fetch(apiUrl);
        
        if (!response.ok) throw new Error("無法讀取 GitHub 資料夾");

        const data = await response.json();

        // 篩選出圖檔（jpg, jpeg, png, gif, webp）
        memesList = data
          .filter(file => file.type === "file" && /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name))
          .map(file => file.path);

        if (memesList.length > 0) {
          getRandomMeme();
        } else {
          loadingElement.innerText = "資料夾內沒有找到圖片檔！";
        }
      } catch (error) {
        console.error(error);
        loadingElement.innerText = "讀取圖片失敗，請確認 GitHub 設定";
      }
    }

    // 隨機抽取圖片
    function getRandomMeme() {
      if (memesList.length === 0) return;

      const imgElement = document.getElementById("meme");
      const loadingElement = document.getElementById("loading");

      loadingElement.innerText = "抽取厭世能量中... 🎲";
      loadingElement.style.display = "block";
      imgElement.style.display = "none";

      let randomIndex;
      // 避免連續兩次抽到相同的圖片
      do {
        randomIndex = Math.floor(Math.random() * memesList.length);
      } while (randomIndex === lastIndex && memesList.length > 1);

      lastIndex = randomIndex;
      const selectedImgSrc = memesList[randomIndex];

      // 預載圖片確保載入完成後流暢顯示
      const tempImg = new Image();
      tempImg.src = selectedImgSrc;
      tempImg.onload = () => {
        imgElement.src = selectedImgSrc;
        loadingElement.style.display = "none";
        imgElement.style.display = "block";
      };
    }

    // 初始化：載入動態清單
    window.onload = fetchMemeList;
  </script>
</body>
</html>
