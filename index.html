<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大雜燴轉盤 ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(rgba(8, 11, 14, 0.85), rgba(8, 11, 14, 0.85)), 
                  url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
      overflow-x: hidden;
    }

    /* 頂部仙俠標題 */
    .header-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #e2e8f0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(56, 189, 248, 0.4);
      letter-spacing: 0.15em;
      font-weight: 900;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      letter-spacing: 0.1em;
      margin-top: 5px;
    }

    /* 🎰 法陣主視窗 */
    .slot-machine-container {
      width: 100%;
      max-width: 480px;
      height: 380px;
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #475569;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 0, 0, 0.9), 0 0 15px rgba(56, 189, 248, 0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .slot-screen {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      object-fit: contain;
    }

    /* 📜 中間文字轉動動畫與樣式 */
    .spinning-text {
      font-size: 1.35rem;
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
      text-align: center;
      line-height: 1.6;
      padding: 0 20px;
      animation: textPulse 0.6s infinite alternate;
    }

    @keyframes textPulse {
      0% { opacity: 0.7; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* 📜 底部提示文字區 */
    .status-container {
      width: 100%;
      max-width: 480px;
      height: 50px;
      margin-top: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #status-text {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      color: #7dd3fc;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
      text-align: center;
      transition: all 0.3s ease;
    }

    /* 🎮 控制按鈕與把手 */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .spin-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #38bdf8;
      border: 2px solid #38bdf8;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
      letter-spacing: 0.1em;
    }

    .spin-btn.active-stop {
      background: linear-gradient(135deg, #991b1b 0%, #450a0a 100%);
      color: #fca5a5;
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }

    .spin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
    }

    .spin-btn:active {
      transform: translateY(1px);
    }

    /* 🕹️ 仙俠金屬把手 */
    .lever-container {
      width: 18px;
      height: 75px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .lever-stick {
      width: 6px;
      height: 55px;
      background: linear-gradient(to right, #64748b, #94a3b8, #475569);
      position: absolute;
      top: 10px;
      transform-origin: bottom center;
      transition: transform 0.3s ease;
    }

    .lever-ball {
      width: 22px;
      height: 22px;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #0369a1);
      border-radius: 50%;
      position: absolute;
      top: -10px;
      left: -8px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .lever-pull .lever-stick {
      transform: rotateX(60deg) scaleY(0.5);
    }
  </style>
</head>
<body>

  <div class="header-banner">
    <h1>六人成虎 ‧ 渡劫法陣 ⚡</h1>
    <div class="subtitle">— 職場萬劫不復，唯有抽籤渡化 —</div>
  </div>

  <!-- 🎰 主視窗：運轉時顯示文字，煞車時顯示圖片 -->
  <div class="slot-machine-container">
    <div class="slot-screen" id="slot-screen">
      <div id="center-text" class="spinning-text">☯️ 靜候召喚...</div>
      <img id="meme" src="" alt="仙俠籤圖" style="display: none;">
    </div>
  </div>

  <!-- 📜 底部狀態區 -->
  <div class="status-container">
    <div id="status-text">請拉動把手，啟動渡劫法陣 ☯️</div>
  </div>

  <!-- 🎮 控制區 -->
  <div class="controls">
    <button id="draw-btn" class="spin-btn" onclick="toggleSlot()">啟動法陣 ⚡</button>
    <div id="lever" class="lever-container">
      <div class="lever-stick">
        <div class="lever-ball"></div>
      </div>
    </div>
  </div>

  <script>
    const username = "lair06";
    const repo = "meme-site";
    const folderPath = "meme picture";

    let memesList = [];
    let lastIndex = -1;
    let isSpinning = false;
    let textInterval = null;
    let currentText = "";

    // 🤪 仙俠修仙 × 職場無厘頭文字庫
    const xianxiaTexts = [
      "【正在偷翻掌門人的內褲...】",
      "【深入6F洗手間渡劫中...】",
      "【偷看長老皮夾裡的靈石數量...】",
      "【強行吸收隔壁師兄的加班廢氣...】",
      "【正在審查同門師弟的離職心法...】",
      "【茶水間偷聽仙界密辛中...】",
      "【潛入老祖夢境索取特休假...】",
      "【計算今日偷懶獲得的修為...】",
      "【正在幫掌門的靈丹偷加廢料...】",
      "【正在修改天劫考勤系統...】",
      "【召喚「不想上工」之太古魔尊...】"
    ];

    async function fetchMemeList() {
      const statusText = document.getElementById("status-text");
      try {
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${encodeURIComponent(folderPath)}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("無法讀取 GitHub 資料夾");

        const data = await response.json();
        memesList = data
          .filter(file => file.type === "file" && /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name))
          .map(file => file.path);

        if (memesList.length > 0) {
          statusText.innerText = "法陣已就緒，請啟動！ ☯️";
        } else {
          statusText.innerText = "資料夾內尚未放置靈圖！";
        }
      } catch (error) {
        console.error(error);
        statusText.innerText = "法陣連線失敗，請檢查設定！";
      }
    }

    function toggleSlot() {
      if (memesList.length === 0) return;

      if (!isSpinning) {
        startSpinning();
      } else {
        stopSpinning();
      }
    }

    // 啟動：隱藏圖片，開啟文字轉動
    function startSpinning() {
      isSpinning = true;
      const drawBtn = document.getElementById("draw-btn");
      const lever = document.getElementById("lever");
      const imgElement = document.getElementById("meme");
      const centerText = document.getElementById("center-text");
      const statusText = document.getElementById("status-text");

      // 把手拉下動畫
      lever.classList.add("lever-pull");
      setTimeout(() => lever.classList.remove("lever-pull"), 400);

      // 1. 隱藏圖片，顯示中央文字
      imgElement.style.display = "none";
      centerText.style.display = "block";

      // 2. 切換按鈕狀態
      drawBtn.innerText = "🛑 煞車！開箱結緣";
      drawBtn.classList.add("active-stop");

      // 3. 立即切換第一句文字
      updateRandomText();
      statusText.innerText = "天機運轉中... 每3秒變換心法 ⚡";

      // 4. 文字轉動：每 3 秒更換一次無厘頭文字
      textInterval = setInterval(() => {
        updateRandomText();
      }, 3000);
    }

    function updateRandomText() {
      currentText = xianxiaTexts[Math.floor(Math.random() * xianxiaTexts.length)];
      document.getElementById("center-text").innerText = currentText;
    }

    // 停止：隱藏文字，顯示最終抽到的梗圖
    function stopSpinning() {
      const drawBtn = document.getElementById("draw-btn");
      const imgElement = document.getElementById("meme");
      const centerText = document.getElementById("center-text");
      const statusText = document.getElementById("status-text");

      clearInterval(textInterval);

      // 1. 隨機選圖
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * memesList.length);
      } while (randomIndex === lastIndex && memesList.length > 1);
      lastIndex = randomIndex;

      const selectedImgSrc = memesList[randomIndex];
      imgElement.src = selectedImgSrc;

      // 2. 隱藏轉動文字，顯現梗圖
      centerText.style.display = "none";
      imgElement.style.display = "block";

      // 3. 底部顯示當前定格的文字，定格 3 秒
      statusText.innerText = `✨ 結緣成功：${currentText}`;

      // 4. 重置按鈕狀態
      drawBtn.innerText = "啟動法陣 ⚡";
      drawBtn.classList.remove("active-stop");
      isSpinning = false;

      // 5. 3 秒後恢復預設提示文字
      setTimeout(() => {
        if (!isSpinning) {
          statusText.innerText = "法陣已就緒，請再次啟動！ ☯️";
        }
      }, 3000);
    }

    window.onload = fetchMemeList;
  </script>
</body>
</html>
