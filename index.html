<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上班厭世梗圖抽取器 💼</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1d;
      color: #eeeeee;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #a2a2a2;
      font-weight: normal;
    }
    .meme-container {
      width: 100%;
      max-width: 500px; /* 限制容器最大寬度，避免圖片太大 */
      height: 60vh;
      max-height: 500px; /* 限制容器最大高度 */
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      position: relative;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      object-fit: contain; /* 確保圖片不變形且完整顯示 */
    }
    button {
      background-color: #4e542e;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #616939;
    }
    button:active {
      transform: scale(0.95);
    }
    #loading {
      font-size: 1rem;
      color: #888;
      position: absolute;
    }
  </style>
</head>
<body>

  <h1>💼 今天又是不想上班的一天...</h1>

  <div class="meme-container">
    <div id="loading">抽取厭世能量中... 🎲</div>
    <img id="meme" src="" alt="上班厭世梗圖" style="display: none;">
  </div>

  <button onclick="getRandomMeme()">再抽一張厭世圖 😮‍💨</button>

  <script>
    function getRandomMeme() {
      const imgElement = document.getElementById("meme");
      const loadingElement = document.getElementById("loading");

      loadingElement.style.display = "block";
      imgElement.style.display = "none";

      // 產生隨機數，確保不會用到快取，圖片尺寸嚴格限制在 500x500 內（載入超快）
      const randomSeed = Math.floor(Math.random() * 1000);
      const imageUrl = `https://picsum.photos/seed/${randomSeed}/500/500`;

      // 建立預載物物件，確保載入成功才顯示
      const newImg = new Image();
      newImg.src = imageUrl;

      newImg.onload = () => {
        imgElement.src = imageUrl;
        loadingElement.style.display = "none";
        imgElement.style.display = "block";
      };

      // 萬一 3 秒內沒反應，自動補救
      setTimeout(() => {
        if (imgElement.style.display === "none") {
          imgElement.src = "https://picsum.photos/500/500";
          loadingElement.style.display = "none";
          imgElement.style.display = "block";
        }
      }, 3000);
    }

    // 第一次進頁面自動隨機顯示
    window.onload = getRandomMeme;
  </script>
</body>
</html>
