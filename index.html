<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上班厭世梗圖抽取器 💼</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* 深邃質感暗色背景搭配微弱漸層 */
      background: radial-gradient(circle at 50% 20%, #1e1e24 0%, #0d0d11 100%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.35rem;
      margin-bottom: 24px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .meme-container {
      width: 100%;
      max-width: 480px;
      height: 60vh;
      max-height: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 32px;
      position: relative;
      /* 毛玻璃外框效果 */
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      object-fit: contain;
      /* 淡入動畫 */
      transition: opacity 0.3s ease, transform 0.3s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* 圖片淡出與放大的動態效果 */
    .fade-out {
      opacity: 0;
      transform: scale(0.96);
    }

    button {
      /* 絢麗漸層按鈕 */
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      border: none;
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.03em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(168, 85, 247, 0.5);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    #loading {
      font-size: 0.95rem;
      color: #64748b;
      position: absolute;
      font-weight: 400;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <h1>💼 今天又是不想上班的一天...</h1>

  <div class="meme-container">
    <div id="loading">載入圖片庫中... 🎲</div>
    <img id="meme" src="" alt="上班厭世梗圖" class="fade-out" style="display: none;">
  </div>

  <button onclick="getRandomMeme()">再抽一張厭世圖 😮‍💨</button>

  <script>
    const username = "lair06";
    const repo = "meme-site";
    const folderPath = "meme picture";

    let memesList = [];
    let lastIndex = -1;

    async function fetchMemeList() {
      const loadingElement = document.getElementById("loading");
      try {
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${encodeURIComponent(folderPath)}`;
        const response = await fetch(apiUrl);
        
        if (!response.ok) throw new Error("無法讀取 GitHub 資料夾");

        const data = await response.json();

        memesList = data
          .filter(file => file.type === "file" && /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name))
          .map(file => file.path);

        if (memesList.length > 0) {
          getRandomMeme();
        } else {
          loadingElement.innerText = "資料夾內沒有找到圖片檔！";
        }
      } catch (error) {
        console.error(error);
        loadingElement.innerText = "讀取圖片失敗，請確認 GitHub 設定";
      }
    }

    function getRandomMeme() {
      if (memesList.length === 0) return;

      const imgElement = document.getElementById("meme");
      const loadingElement = document.getElementById("loading");

      // 動態漸隱舊圖
      imgElement.classList.add("fade-out");
      loadingElement.innerText = "抽取厭世能量中... 🎲";
      loadingElement.style.display = "block";

      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * memesList.length);
      } while (randomIndex === lastIndex && memesList.length > 1);

      lastIndex = randomIndex;
      const selectedImgSrc = memesList[randomIndex];

      const tempImg = new Image();
      tempImg.src = selectedImgSrc;
      tempImg.onload = () => {
        imgElement.src = selectedImgSrc;
        loadingElement.style.display = "none";
        imgElement.style.display = "block";
        
        // 延遲微調，呈現滑順淡入
        setTimeout(() => {
          imgElement.classList.remove("fade-out");
        }, 50);
      };
    }

    window.onload = fetchMemeList;
  </script>
</body>
</html>
